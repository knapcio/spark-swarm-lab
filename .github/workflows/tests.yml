name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Offline audits verify historical frozen source tags.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare pinned agent source used by the arbiter-free and variant controllers
        run: git worktree add --detach .runtime/nemotron-long-source ce6c0b6e583596faf15e4f556b0d73f09fb0b6a4
      - run: python -m unittest -q
      - name: Prepare immutable throughput validation
        run: git worktree add --detach "${{ runner.temp }}/throughput-timeoutguard" 7bb965b073af8cdc211404186c15463d5cfc374e
      - name: Verify frozen timeout margin and exact source delta
        working-directory: ${{ runner.temp }}/throughput-timeoutguard
        run: python -m unittest -q test_throughput_timeoutguard
      - run: python export_benchmark.py --self-test
      - run: python validate_frozen_corpora.py
